server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

# Token compartido con la app (header X-Gradify-Token). Vacío = sin verificación.
app:
  token: ${APP_TOKEN:}

# Clave de API de Gemini (variable de entorno preferible en producción)
gemini:
  api-key: ${GEMINI_API_KEY:}
  model: gemini-2.5-flash
  fallback-models:
    - gemini-2.5-flash-lite
    - gemini-2.0-flash

# Rate limiting
rate-limit:
  requests-per-minute: 30
  burst-capacity: 5

logging:
  level:
    com.gradify: DEBUG
    root: INFO
