name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  # Falla si un commit nuevo trae claves, tokens o credenciales. Los client IDs de OAuth
  # y las huellas SHA-1 son públicos y no cuentan.
  secret-scan:
    name: Escaneo de secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      # google-services.json real no está en el repo: se genera uno de relleno para compilar
      - name: google-services.json de relleno
        run: |
          sed -e 's/YOUR_PROJECT_NUMBER/123456789012/g' -e 's/YOUR_PROJECT_ID/ci/g' \
              -e 's/YOUR_APP_HASH/abc123/g' -e 's/YOUR_[A-Z_0-9]*/ci/g' \
              google-services.example.json > app/google-services.json
      - run: ./gradlew testDebugUnitTest assembleDebug lintDebug assembleDebugAndroidTest

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - run: gradle test
        working-directory: backend

  release:
    name: Release firmado (tags v*)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [secret-scan, android, backend]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4

      # Google (opcional). Con GOOGLE_SERVICES_JSON_BASE64 (secreto) y GOOGLE_CLIENT_ID (variable) el APK
      # incluye el inicio de sesión con Google; sin ellos sale con uno de relleno y funciona sin cuenta.
      - name: Configuración de Google (opcional)
        env:
          GS_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          WEB_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
        run: |
          if [ -n "$GS_B64" ] && [ -n "$WEB_CLIENT_ID" ]; then
            echo "$GS_B64" | base64 -d > app/google-services.json
            echo "GOOGLE_CLIENT_ID=$WEB_CLIENT_ID" > local.properties
          else
            echo "::warning::Sin configuración de Google: el APK saldrá sin inicio de sesión con Google"
            sed -e 's/YOUR_PROJECT_NUMBER/123456789012/g' -e 's/YOUR_PROJECT_ID/ci/g' \
                -e 's/YOUR_APP_HASH/abc123/g' -e 's/YOUR_[A-Z_0-9]*/ci/g' \
                google-services.example.json > app/google-services.json
          fi

      # Secretos necesarios: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
      # ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
      - name: Preparar keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Faltan los secretos de firma (ANDROID_KEYSTORE_BASE64...)"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          cat > key.properties <<PROPS
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$RUNNER_TEMP/upload-keystore.jks
          PROPS

      # El tag debe coincidir con versionName y las notas son la sección de esa versión en CHANGELOG.md.
      - name: Notas de la versión (CHANGELOG)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APP=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "$VERSION" != "$APP" ]; then
            echo "::error::El tag $GITHUB_REF_NAME no coincide con versionName ($APP)"
            exit 1
          fi
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {found=1; next}
            found && /^## \[/ {exit}
            found {print}
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "::error::CHANGELOG.md no tiene la sección [$VERSION]"
            exit 1
          fi
          cat >> release_notes.md <<'NOTES'

          ---
          **Instalar:** descarga `gradify.apk` y ábrelo; Android pedirá permiso para instalar apps de origen desconocido. Se instala encima de la versión anterior sin perder tus notas. Funciona sin cuenta de Google.
          NOTES

      - name: Build APK (release)
        run: ./gradlew assembleRelease

      - name: Verificar firma del APK
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/gradify.apk | grep -E "Signer #1 certificate (DN|SHA-256)"

      - uses: softprops/action-gh-release@v2
        with:
          name: Gradify ${{ github.ref_name }}
          body_path: release_notes.md
          files: app/build/outputs/apk/release/gradify.apk
